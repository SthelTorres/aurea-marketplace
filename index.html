<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Áurea é um marketplace de arte digital e NFTs. Explore obras, favorite, monte seu carrinho e conclua a aquisição com cotação em ETH." />
    <meta name="theme-color" content="#0B0706" />
    <meta property="og:title" content="Áurea Marketplace" />
    <meta property="og:description" content="Seja dono do futuro da arte digital. Marketplace de NFTs com coleção, carrinho e checkout simulados." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero.webp" />
    <meta property="og:locale" content="pt_BR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <title>Áurea Marketplace</title>
  </head>
  <body>
    <script>
      (function () {
        var path = location.pathname
        var isDetail = /^\/nfts\/nft-(\d+)/.exec(path)
        if (path !== '/' && !isDetail) return
        var href = '/images/hero-640.webp'
        var alt = 'Obra monumental da coleção Áurea em tons de âmbar e negro'
        if (isDetail) {
          var slot = ((Number(isDetail[1]) - 1) % 12) + 1
          href = '/images/nfts/art-' + String(slot).padStart(2, '0') + '.webp'
          alt = 'Obra digital da coleção Áurea'
        }
        document.write('<img id="aurea-lcp" src="' + href + '" alt="' + alt + '" width="640" height="640" fetchpriority="high" decoding="sync" style="width:min(100%,640px);aspect-ratio:1/1;object-fit:cover">')
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
